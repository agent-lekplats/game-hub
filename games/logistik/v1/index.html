      html, body { background: #0d0b08; margin: 0; }

    <script>
      /* Emberhold — mobile routing.
         On phones and tablets this link opens the mobile UI build (../mobile/) instead.
         Add ?ui=desktop to stay on this build, or ?ui=mobile to force the mobile one;
         the choice is remembered for the browser session. */
      (function () {
        try {
          var ui = new URLSearchParams(window.location.search).get("ui");
          if (ui === "desktop" || ui === "mobile") sessionStorage.setItem("emberhold.ui", ui);
          var pref = sessionStorage.getItem("emberhold.ui");
          var ua = window.navigator.userAgent || "";
          var uaMobile = /iPhone|iPod|Android.+Mobile|Windows Phone|Mobile Safari|Silk|Kindle|Opera Mini|IEMobile/i.test(ua);
          var ipadLike = /Macintosh/.test(ua) && (window.navigator.maxTouchPoints || 0) > 1;
          var coarse = window.matchMedia ? window.matchMedia("(pointer: coarse)").matches : false;
          var fine = window.matchMedia ? window.matchMedia("(pointer: fine)").matches : false;
          var touchOnly = (coarse || ipadLike) && !fine;
          var wantsMobile = pref === "mobile" || (pref !== "desktop" && (uaMobile || touchOnly));
          if (wantsMobile) {
            var base = window.location.href.split("#")[0].split("?")[0];
            var last = base.substring(base.lastIndexOf("/") + 1);
            if (last && last.indexOf(".") === -1) base += "/"; /* directory without trailing slash */
            else if (last) base = base.substring(0, base.lastIndexOf("/") + 1); /* index.html → its directory */
            var target = new URL("../mobile/", base);
            target.search = window.location.search;
            target.hash = window.location.hash;
            window.location.replace(target.href);
          }
        } catch (err) {
          /* detection failed → stay on this (desktop) build */
        }
      })();
    </script>
